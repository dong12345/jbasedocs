<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JBaseLibrary 文档</title>
    <link rel="stylesheet" href="./css/vue.css">
    <link rel="stylesheet" href="./css/custom.css">
</head>
<body>
    <div id="app">加载中...</div>
    <script>
        window.$docsify = {
            name: 'JBase文档中心',
            nameLink: '../index.html',
            loadSidebar: true,
            subMaxLevel: 3,
            auto2top: true,
            search: {
                maxAge: 86400000,
                paths: 'auto',
                placeholder: '搜索',
                noData: '没有结果!'
            },
            pagination: {
                previousText: '上一章',
                nextText: '下一章',
                crossChapter: true
            },
            copyCode: {
                buttonText: '复制',
                errorText: '复制失败',
                successText: '复制成功'
            }
        }
    </script>
  <script src="./js/docsify.min.js"></script>
  <script src="./js/search.min.js"></script>
  <script src="./js/docsify-copy-code.min.js"></script>
  <script src="./js/docsify-pagination.min.js"></script>
  <script src="./js/prism-csharp.min.js"></script>
  <script src="./js/prism-json.min.js"></script>
  <script src="./js/prism-bash.min.js"></script>
</body>
</html>
