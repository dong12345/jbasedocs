<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>JBase 文档中心</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="description" content="JBase 文档中心">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Helvetica,Arial,sans-serif;padding:30px}
    .container{max-width:800px;margin:0 auto}
    .title{font-size:28px;font-weight:600;margin-bottom:10px;color:#24292f}
    .desc{font-size:16px;color:#656d76;margin-bottom:30px}
    .card{background:#fff;border:1px solid #e1e4e8;border-radius:6px;padding:20px;margin-bottom:16px;transition:all .2s;text-decoration:none;display:block}
    .card:hover{border-color:#42b983;box-shadow:0 4px 12px rgba(66,185,131,0.15)}
    .card a{text-decoration:none;font-size:18px;font-weight:500;color:#24292f;display:block}
    .card .name{font-size:18px;font-weight:600;color:#24292f;margin-bottom:4px}
    .card .desc{font-size:14px;color:#656d76;margin-bottom:0}
    .card .arrow{color:#42b983;font-weight:500;margin-top:8px;opacity:0;transition:opacity .2s}
    .card:hover .arrow{opacity:1}
  </style>
</head>
  <body>
  <div class="container">
    <div class="title">JBase 文档中心</div>
    <div class="desc">选择需要查看的模块文档</div>

    <a href="./jbase_library/" class="card">
      <div class="name">jbase_library 模块文档</div>
      <div class="desc">基础类库、常用方法</div>
      <div class="arrow">点击进入 →</div>
    </a>

    <a href="./jbase_common/" class="card">
      <div class="name">jbase_common 模块文档</div>
      <div class="desc">通用工具库、基础组件</div>
      <div class="arrow">点击进入 →</div>
    </a>

    <a href="./jbase_freesql/" class="card">
      <div class="name">jbase_freesql 模块文档</div>
      <div class="desc">数据库操作、FreeSql 封装</div>
      <div class="arrow">点击进入 →</div>
    </a>
  </div>
</body>
</html>
